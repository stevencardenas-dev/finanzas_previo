<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorías - Finanzas Personales</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">FinanzasApp</div>
      <ul class="nav-links">
        <li><a href="dashboard.html"><i class="fas fa-home"></i> Resumen</a></li>
        <li><a href="transacciones.html"><i class="fas fa-exchange-alt"></i> Transacciones</a></li>
        <li><a href="categorias.html" class="active"><i class="fas fa-tags"></i> Categorías</a></li>
        <li><a href="beneficiarios.html"><i class="fas fa-users"></i> Beneficiarios</a></li>
        <li><a href="cuentas.html"><i class="fas fa-university"></i> Fuentes de Pago</a></li>
      </ul>
      <button class="btn-icon" id="logout-btn" title="Cerrar Sesión" style="width: 100%; border-radius: 8px; margin-top: auto; display: flex; gap: 0.5rem; justify-content: flex-start; padding: 0.75rem 1rem;">
        <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
      </button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="header">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <button class="menu-toggle" id="menu-toggle">
            <i class="fas fa-bars"></i>
          </button>
          <h2>Categorías</h2>
        </div>
        <div class="user-info">
          <span id="user-name-display">Hola, Usuario</span>
          <div class="avatar">U</div>
        </div>
      </header>

      <section class="card">
        <div class="action-header">
          <h3 style="margin:0;">Mis Categorías</h3>
          <button class="btn-small" id="btn-nueva-categoria" style="margin:0;"><i class="fas fa-plus"></i> Nueva Categoría</button>
        </div>
        
        <div class="grid" id="categorias-grid" style="grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));">
          <!-- Categorías generadas dinámicamente -->
        </div>
      </section>
    </main>
  </div>

  <!-- Modal Nueva Categoría -->
  <div class="modal" id="modal-categoria">
    <div class="modal-content">
      <div class="modal-header">
        <h2 style="margin:0;">Nueva Categoría</h2>
        <button class="close-btn" id="close-modal">&times;</button>
      </div>
      <form id="form-categoria">
        <div class="form-group">
          <label for="cat-nombre">Nombre de la Categoría</label>
          <input type="text" id="cat-nombre" required placeholder="Ej. Transporte">
        </div>
        <div class="form-group">
          <label for="cat-tipo">Tipo</label>
          <select id="cat-tipo" required>
            <option value="ingreso">Ingreso</option>
            <option value="gasto">Gasto</option>
          </select>
        </div>
        <button type="submit" style="margin-top: 1rem;">Guardar Categoría</button>
      </form>
    </div>
  </div>

  <script type="module" src="js/categorias.js"></script>
</body>
</html>
