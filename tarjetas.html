<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjetas de Crédito - FinanzasApp</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">FinanzasApp</div>
      <ul class="nav-links">
        <li><a href="dashboard.html"><i class="fas fa-home"></i> Resumen</a></li>
        <li><a href="transacciones.html"><i class="fas fa-chart-line"></i> Transacciones</a></li>
        <li><a href="categorias.html"><i class="fas fa-tags"></i> Categorías</a></li>
        <li><a href="beneficiarios.html"><i class="fas fa-users"></i> Beneficiarios</a></li>
        <li><a href="cuentas.html"><i class="fas fa-university"></i> Fuentes de Pago</a></li>
        <li><a href="tarjetas.html" class="active"><i class="fas fa-credit-card"></i> Tarjetas</a></li>
      </ul>
      <button class="btn-icon" id="logout-btn" title="Cerrar Sesión" style="width: 100%; border-radius: 8px; margin-top: auto; display: flex; gap: 0.5rem; justify-content: flex-start; padding: 0.75rem 1rem;">
        <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
      </button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="header">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button>
          <h2>Tarjetas de Crédito</h2>
        </div>
        <div class="user-info">
          <span id="user-name-display">Hola, Usuario</span>
          <div class="avatar">U</div>
        </div>
      </header>

      <!-- Stats Row -->
      <div class="grid" id="stats-row" style="margin-bottom: 1.5rem; display: none;">
        <div class="card" style="display: flex; align-items: center; gap: 1rem;">
          <div style="width: 48px; height: 48px; border-radius: 12px; background: var(--gradient-brand); display: flex; align-items: center; justify-content: center;">
            <i class="fas fa-credit-card" style="color: #0f172a;"></i>
          </div>
          <div>
            <div style="font-size: 0.8rem; color: var(--text-secondary);">Total Tarjetas</div>
            <div id="stat-total" style="font-size: 1.5rem; font-weight: 700;">0</div>
          </div>
        </div>
        <div class="card" style="display: flex; align-items: center; gap: 1rem;">
          <div style="width: 48px; height: 48px; border-radius: 12px; background: rgba(34,197,94,0.15); display: flex; align-items: center; justify-content: center;">
            <i class="fas fa-check-circle" style="color: var(--success-color);"></i>
          </div>
          <div>
            <div style="font-size: 0.8rem; color: var(--text-secondary);">Activas</div>
            <div id="stat-active" style="font-size: 1.5rem; font-weight: 700; color: var(--success-color);">0</div>
          </div>
        </div>
        <div class="card" style="display: flex; align-items: center; gap: 1rem;">
          <div style="width: 48px; height: 48px; border-radius: 12px; background: rgba(45,212,191,0.15); display: flex; align-items: center; justify-content: center;">
            <i class="fas fa-wallet" style="color: var(--primary-color);"></i>
          </div>
          <div>
            <div style="font-size: 0.8rem; color: var(--text-secondary);">Cupo Total</div>
            <div id="stat-cupo" style="font-size: 1.5rem; font-weight: 700; color: var(--primary-color);">$0</div>
          </div>
        </div>
      </div>

      <!-- Cards Grid Section -->
      <section class="card">
        <div class="action-header" style="margin-bottom: 1.5rem;">
          <h3 style="margin: 0;">Mis Tarjetas</h3>
          <button id="btn-nueva-tarjeta" class="btn-small" style="margin: 0;">
            <i class="fas fa-plus"></i> Nueva Tarjeta
          </button>
        </div>

        <div class="cards-grid" id="cards-grid">
          <!-- Cargado dinámicamente -->
        </div>
      </section>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal" id="modal-tarjeta">
    <div class="modal-content" style="max-width: 480px;">
      <div class="modal-header">
        <h2 style="margin: 0;"><i class="fas fa-credit-card" style="color: var(--primary-color); margin-right: 0.5rem;"></i>Nueva Tarjeta</h2>
        <button class="close-btn" id="close-modal">&times;</button>
      </div>
      <form id="form-tarjeta">
        <div class="form-group">
          <label for="card-nombre">Nombre de la Tarjeta</label>
          <input type="text" id="card-nombre" placeholder="Ej. Visa Oro, Mastercard Black..." required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group" style="margin-bottom: 0;">
            <label for="card-moneda">Moneda</label>
            <select id="card-moneda" required>
              <option value="COP">COP - Peso</option>
              <option value="USD">USD - Dólar</option>
              <option value="EUR">EUR - Euro</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <label for="card-cupo">Cupo Total</label>
            <input type="number" id="card-cupo" placeholder="5000000" min="0" required>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.5rem;">
          <div class="form-group" style="margin-bottom: 0;">
            <label for="card-dia-corte">Día de Corte</label>
            <input type="number" id="card-dia-corte" min="1" max="31" value="15" required>
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <label for="card-dia-pago">Día de Pago</label>
            <input type="number" id="card-dia-pago" min="1" max="31" value="30" required>
          </div>
        </div>

        <button type="submit" style="margin-top: 2rem; width: 100%;">
          <i class="fas fa-plus"></i> Guardar Tarjeta
        </button>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module" src="js/tarjetas.js"></script>
</body>
</html>
